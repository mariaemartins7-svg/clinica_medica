<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contato | MedTech Clínica Médica</title>
<meta name="description" content="Agende sua consulta ou fale com a MedTech Clínica Médica.">
<meta name="theme-color" content="#10233F">
<link rel="icon" href="../static/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../static/css/style.css">
</head>
<body data-root="../">
<header id="site-header"></header>
<main>
<section class="page-hero"><div class="container"><h1>Agende sua consulta</h1><p>Preencha o formulário e retornamos em breve.</p></div></section>
<section class="secao">
  <div class="container contato-grid">
    <div class="info">
      <h2>Fale com a gente</h2>
      <p><strong>Telefone</strong>(15) 0000-0000</p>
      <p><strong>E-mail</strong>contato@medtech.com.br</p>
      <p><strong>Endereço</strong>Rua Exemplo, 000 – Sorocaba/SP</p>
      <p><strong>Horário</strong>Segunda a sexta, 7h às 19h</p>
      <img class="foto" src="../static/img/fachada.png" alt="Sala de espera da MedTech" loading="lazy" style="margin-top:1rem;max-height:260px">
    </div>
    <div>
      <div id="retorno" class="retorno" role="status" aria-live="polite"></div>
      <form id="form-agendamento" novalidate>
        <div class="campo"><label for="nome">Nome completo</label><input id="nome" name="nome" autocomplete="name" required><span class="erro"></span></div>
        <div class="campo"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required><span class="erro"></span></div>
        <div class="campo"><label for="telefone">Telefone com DDD</label><input id="telefone" name="telefone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="(15) 99999-9999" required><span class="erro"></span></div>
        <div class="campo"><label for="especialidade">Especialidade</label>
          <select id="especialidade" name="especialidade" required>
            <option value="">Selecione</option><option>Cardiologia</option><option>Clínica geral</option><option>Dermatologia</option><option>Pediatria</option><option>Ginecologia</option><option>Ortopedia</option>
          </select><span class="erro"></span></div>
        <div class="campo"><label for="data">Data preferida (opcional)</label><input id="data" name="data" type="date"></div>
        <div class="campo"><label for="mensagem">Mensagem</label><textarea id="mensagem" name="mensagem" required></textarea><span class="erro"></span></div>
        <button class="btn" type="submit">Enviar pedido</button>
      </form>
    </div>
  </div>
</section>
</main>
<footer id="site-footer"></footer>
<script src="../static/js/main.js"></script>
<script src="../static/js/formulario.js"></script>
</body>
</html>
